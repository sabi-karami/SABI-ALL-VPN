name: Validate source and private-panel boundaries
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r panel/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check panel/static/app.js && node --check panel/static/login.js
      - run: sha256sum --check MANIFEST.sha256
